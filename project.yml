name: GeetHub
options:
  bundleIdPrefix: com.nixsocket
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

packages:
  GeetHubKit:
    path: GeetHubKit

# Only expose the app scheme. The widget target still builds (implicit
# dependency of GeetHub), but no scheme is shared for it — that prevents the
# "Failed to show Widget" error you get when you accidentally pick the widget
# scheme in Xcode's toolbar picker.
schemes:
  GeetHub:
    build:
      targets:
        GeetHub: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:
  GeetHub:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: GeetHubKit
      - target: GeetHubWidget
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Geet-Hub
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        UIAppFonts:
          - Oswald.ttf
        # iPhone stays portrait-only (vinyl UI is designed for it). iPad and
        # Mac Catalyst get all orientations via the ~ipad variant below.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Self-hosted servers may be plain http (Tailscale/LAN); allow it.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nixsocket.geethub
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_ENTITLEMENTS: App/GeetHub.entitlements
        # Personal team (NISCHAL NIROULA) — automatic signing for device installs.
        # The simulator ignores this and builds unsigned regardless.
        DEVELOPMENT_TEAM: J27CK6TLVS
        CODE_SIGN_STYLE: Automatic
        # Mac Catalyst — same target, runs the iOS app on macOS via the UIKit
        # bridge. iOS-26-only chrome (tabViewBottomAccessory, tabBarMinimize)
        # is guarded with #if targetEnvironment(macCatalyst) in App code.
        SUPPORTS_MACCATALYST: YES
        # Same bundle id on Mac, not a derived .maccatalyst.* variant.
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        # Disable the alternative "Designed for iPad" mode — we're a real
        # Catalyst app, not the scaled iPad-simulator shim.
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO

  # Home-screen widget extension. Reads the current NowPlayingSnapshot from
  # the shared App Group and renders it (Small + Medium).
  GeetHubWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
    dependencies:
      - package: GeetHubKit
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Geet-Hub Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        # Match the app's ATS so http:// self-hosted servers work here too.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nixsocket.geethub.widget
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_ENTITLEMENTS: Widget/GeetHubWidget.entitlements
        DEVELOPMENT_TEAM: J27CK6TLVS
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
